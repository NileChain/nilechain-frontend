<ng-template #navBody>
  <div class="flex items-center gap-3 px-2 mb-8 mt-4">
    <div
      class="w-10 h-10 bg-primary-container rounded-lg flex items-center justify-center text-on-primary"
    >
      <span
        class="material-symbols-outlined"
        style="font-variation-settings: 'FILL' 1"
        aria-hidden="true"
        >eco</span
      >
    </div>
    <div>
      <h1 class="font-headline-sm text-headline-sm font-bold text-primary">
        NileChain B2B
      </h1>
      <p class="font-label-sm text-label-sm text-on-surface-variant opacity-70">
        Enterprise Portal
      </p>
    </div>
  </div>

  <nav class="flex-1 space-y-1" aria-label="Admin navigation">
    @for (item of items; track item.key) {
      <a
        [routerLink]="item.link"
        [class]="
          active() === item.key
            ? 'sidebar-active flex items-center gap-3 px-4 py-3 rounded-lg font-label-md text-label-md transition-all duration-100 active:scale-95'
            : 'text-on-surface-variant hover:bg-surface-container-high flex items-center gap-3 px-4 py-3 rounded-lg font-label-md text-label-md transition-all duration-150'
        "
        [attr.aria-current]="active() === item.key ? 'page' : null"
      >
        <span class="material-symbols-outlined" aria-hidden="true">{{
          item.icon
        }}</span>
        <span class="font-label-md text-label-md">{{
          item.labelKey | translate
        }}</span>
      </a>
    }
  </nav>

  <div class="pt-4 border-t border-outline-variant space-y-1">
    <button
      type="button"
      (click)="logout()"
      class="w-full text-start text-on-surface-variant hover:bg-surface-container-high flex items-center gap-3 px-4 py-3 rounded-lg font-label-md text-label-md transition-all duration-150"
    >
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      {{ 'nav.logout' | translate }}
    </button>
  </div>
</ng-template>

<aside
  class="fixed start-0 top-0 h-full w-[280px] bg-surface-container-low border-e border-outline-variant flex-col p-4 space-y-2 z-50 hidden md:flex"
>
  <ng-container *ngTemplateOutlet="navBody" />
</aside>

@if (mobileNav.open()) {
  <div
    class="fixed inset-0 z-[60] md:hidden"
    [attr.aria-label]="'common.toggleMenu' | translate"
  >
    <div
      class="absolute inset-0 bg-black/50 animate-fade-in"
      (click)="mobileNav.closeMenu()"
      [attr.aria-hidden]="true"
    ></div>
    <aside
      class="absolute start-0 top-0 h-full w-[280px] bg-surface-container-low border-e border-outline-variant flex-col p-4 space-y-2"
      role="dialog"
      aria-modal="true"
    >
      <div class="flex justify-end">
        <button
          type="button"
          class="p-2 hover:bg-surface-container-high rounded-full text-on-surface-variant"
          (click)="mobileNav.closeMenu()"
          [attr.aria-label]="'common.close' | translate"
        >
          <span class="material-symbols-outlined" aria-hidden="true"
            >close</span
          >
        </button>
      </div>
      <ng-container *ngTemplateOutlet="navBody" />
    </aside>
  </div>
}
