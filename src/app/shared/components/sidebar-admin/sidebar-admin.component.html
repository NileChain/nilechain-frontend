<ng-template #navBody>
  <div class="app-sidebar__inner">
    <div class="app-sidebar__brand">
      <div class="app-sidebar__brand-mark" aria-hidden="true">
        <ui-brand-mark [size]="28" [decorative]="true" />
      </div>
      <div class="min-w-0">
        <p class="app-sidebar__brand-title">NileChain B2B</p>
        <p class="app-sidebar__brand-sub">
          {{ 'nav.adminPortal' | translate }}
        </p>
      </div>
    </div>

    <div class="app-sidebar__scroll">
      <p class="app-sidebar__section-label">
        {{ 'nav.mainSection' | translate }}
      </p>
      <nav
        class="app-sidebar__nav"
        [attr.aria-label]="'nav.adminConsole' | translate"
      >
        @for (item of items; track item.key) {
          <a
            [routerLink]="item.link"
            class="app-sidebar__link"
            [class.app-sidebar__link--active]="active() === item.key"
            [attr.aria-current]="active() === item.key ? 'page' : null"
          >
            <span
              class="material-symbols-outlined"
              aria-hidden="true"
              [attr.data-fill]="active() === item.key ? '1' : null"
              >{{ item.icon }}</span
            >
            <span class="truncate">{{ item.labelKey | translate }}</span>
          </a>
        }
      </nav>
    </div>

    <div class="app-sidebar__footer">
      <button
        type="button"
        class="app-sidebar__logout"
        (click)="logout()"
      >
        <span class="material-symbols-outlined icon-flip" aria-hidden="true"
          >logout</span
        >
        {{ 'nav.logout' | translate }}
      </button>
    </div>
  </div>
</ng-template>

<aside
  class="app-sidebar fixed start-0 top-0 hidden md:flex"
  aria-label="Admin navigation"
>
  <ng-container *ngTemplateOutlet="navBody" />
</aside>

@if (mobileNav.open()) {
  <div class="app-sidebar-overlay md:hidden" role="presentation">
    <div
      class="app-sidebar-overlay__backdrop animate-backdrop-in"
      (click)="mobileNav.closeMenu()"
      [attr.aria-hidden]="true"
    ></div>
    <aside
      #drawerPanel
      tabindex="-1"
      class="app-sidebar app-sidebar--drawer animate-slide-in-start outline-none"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'common.toggleMenu' | translate"
    >
      <div class="app-sidebar__drawer-close px-3 pt-2">
        <button
          #drawerClose
          type="button"
          class="ui-icon-btn"
          (click)="mobileNav.closeMenu()"
          [attr.aria-label]="'common.close' | translate"
        >
          <span class="material-symbols-outlined" aria-hidden="true"
            >close</span
          >
        </button>
      </div>
      <ng-container *ngTemplateOutlet="navBody" />
    </aside>
  </div>
}
