<main class="md:ms-[280px] min-h-screen bg-surface">
  <header
    class="h-16 flex justify-between items-center w-full px-margin-desktop bg-surface border-b border-outline-variant sticky top-0 z-40"
  >
    <h1 class="font-headline-md text-headline-md font-bold text-primary">
      {{ 'contractSign.title' | translate }}
    </h1>
    <div class="flex items-center gap-2 sm:gap-4">
      <ui-language-toggle />
      <ui-theme-toggle />
    </div>
  </header>

  <div class="p-margin-mobile md:p-margin-desktop max-w-4xl mx-auto space-y-gutter animate-fade-in">
    <section class="ui-card p-6 space-y-4">
      <p class="font-body-md text-on-surface-variant">
        Generate an AI contract draft for the selected farm match.
      </p>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block font-label-md mb-1" for="factory-name-contract">Factory name</label>
          <input
            id="factory-name-contract"
            class="ui-input"
            [(ngModel)]="factoryName"
            name="factoryName"
          />
        </div>
        <div>
          <label class="block font-label-md mb-1">Farm</label>
          <input class="ui-input" [value]="farmName || '—'" readonly />
        </div>
        <div>
          <label class="block font-label-md mb-1">Request id</label>
          <input class="ui-input" [value]="requestId || '—'" readonly />
        </div>
        <div>
          <label class="block font-label-md mb-1">Farm id</label>
          <input class="ui-input" [value]="farmId || '—'" readonly />
        </div>
      </div>
      <button
        type="button"
        class="ui-btn-primary"
        [disabled]="loading()"
        (click)="generate()"
      >
        {{ loading() ? 'Generating…' : 'Generate contract' }}
      </button>
    </section>

    @if (loading()) {
      <div class="flex justify-center py-8"><ui-loader /></div>
    }

    @if (error()) {
      <p class="text-on-error-container">{{ error() }}</p>
    }

    @if (contractText(); as text) {
      <section class="ui-card p-6">
        <h2 class="font-title-lg text-on-surface mb-4">Contract draft</h2>
        <pre
          class="whitespace-pre-wrap font-body-md text-body-md text-on-surface leading-relaxed bg-surface-container-low p-4 rounded-lg border border-outline-variant overflow-x-auto"
          >{{ text }}</pre
        >
      </section>
    }
  </div>
</main>
