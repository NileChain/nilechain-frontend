<div
  class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface"
>
  <header
    class="fixed top-0 inset-x-0 z-50 flex justify-end items-center gap-1 px-margin-mobile md:px-margin-desktop h-16"
  >
    <ui-language-toggle />
    <ui-theme-toggle />
  </header>

  <main class="w-full max-w-[440px] z-10 animate-fade-in pt-16">
    <div class="glass-panel rounded-xl p-lg md:p-xl">
      <div class="text-center mb-lg">
        <h1
          class="font-headline-lg text-headline-lg text-primary tracking-tight"
        >
          {{ 'forgotPassword.title' | translate }}
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant mt-xs">
          {{ 'forgotPassword.subtitle' | translate }}
        </p>
      </div>

      @if (submitted()) {
        <div class="text-center space-y-md">
          <span
            class="material-symbols-outlined text-5xl text-success-green"
            aria-hidden="true"
            >check_circle</span
          >
          <p class="font-body-md text-body-md text-on-surface-variant">
            {{ 'forgotPassword.sent' | translate }}
          </p>
          <a [routerLink]="'/login'" class="ui-btn-primary inline-block mt-4">
            {{ 'login.title' | translate }}
          </a>
        </div>
      } @else {
        <form (submit)="onSubmit($event)" class="space-y-lg">
          <div class="space-y-xs">
            <label
              for="email"
              class="font-label-sm text-label-sm text-on-surface-variant"
            >
              {{ 'login.email' | translate }}
            </label>
            <input
              type="email"
              id="email"
              autocomplete="email"
              required
              (input)="email.set($any($event.target).value)"
              class="w-full ps-4 pe-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface input-focus-effect outline-none transition-all"
            />
          </div>

          @if (errorMessage()) {
            <p class="text-error font-label-sm" role="alert">
              {{ errorMessage() }}
            </p>
          }

          <button
            type="submit"
            [disabled]="isSubmitting() || !email()"
            class="w-full bg-primary-container text-on-primary py-4 rounded-lg font-label-md text-label-md shadow-lg shadow-primary/20 hover:bg-primary transition-all active:scale-[0.98] duration-150 flex items-center justify-center gap-base disabled:opacity-70 disabled:cursor-not-allowed"
          >
            {{
              isSubmitting()
                ? ('forgotPassword.sending' | translate)
                : ('forgotPassword.submit' | translate)
            }}
          </button>

          <div class="text-center">
            <a
              [routerLink]="'/login'"
              class="text-primary font-bold hover:underline"
            >
              {{ 'login.title' | translate }}
            </a>
          </div>
        </form>
      }
    </div>
  </main>
</div>
