                    },

                    },
                    "fontFamily": {
                        "body-md": ["Work Sans"],
                        "headline-lg-mobile": ["Work Sans"],
                        "headline-md": ["Work Sans"],
                        "headline-sm": ["Work Sans"],
                        "body-lg": ["Work Sans"],
                        "headline-lg": ["Work Sans"],
                        "label-md": ["Work Sans"],
                        "label-sm": ["Work Sans"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}]
                    }
                },
            },
        }
    }catch(_e){}</script></head><body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-x-hidden">
<!-- Atmospheric Background (Subtle Gradient) -->
<div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_top_right,_#E8F5E9_0%,_#F9FBF9_60%)] opacity-50"></div>
<!-- Registration Container -->
<main class="w-full max-w-[480px] z-10 animate-fade-in">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-xl">
<a href="#" onclick="window.top.postMessage({ type: 'navigate', path: '/home' }, window.location.origin); return false;" class="flex flex-col items-center">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDPEIWYWtZnyIwQbN_iGXmWsV8pwt4C_0C-YEczE-9FPtMT4B0E7BoecK9TwkOO9Zzp5gN1Atmh1x9H9b_ZHzKAiaXQM7UKpJm4kGC95Y5zk6bvAjKZ-p5id-P2joyNy0QZplSbH8QetsSXawxym6RYPZunyTHfyEJwkHxv8IZkAzA8RSytLpZRSE6hGh6SsnSOl4UX2jrXhRUM0ZvFdNRmmThMBeY2DEuc0s6fqVimVB5Miu7XRqwX" alt="NileChain Logo" class="h-16 w-auto mb-md">
</a>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Join the Egypt's largest B2B agricultural network</p>
</div>
<!-- Form Card -->
<div class="glass-panel rounded-xl p-lg md:p-xl">
<form action="#" method="POST" class="space-y-lg" id="registerForm">
<!-- Role Selector -->
<div class="space-y-md">
<label class="font-label-md text-label-md text-on-surface block">Business Type</label>
<div class="grid grid-cols-2 gap-md">
<!---->
<button type="button" onclick="selectRole('farm')" id="role-farm" class="flex flex-col items-center justify-center p-md border border-outline-variant rounded-lg transition-all duration-200 hover:bg-surface-container-low group">
<span class="text-[32px] mb-base group-hover:scale-110 transition-transform">🌾</span>
<span class="font-label-md text-label-md text-on-surface">I'm a Farm</span>
</button>
<!-- Role: Factory -->
<button type="button" onclick="selectRole('factory')" id="role-factory" class="flex flex-col items-center justify-center p-md border border-outline-variant rounded-lg transition-all duration-200 hover:bg-surface-container-low group">
<span class="text-[32px] mb-base group-hover:scale-110 transition-transform">🏭</span>
<span class="font-label-md text-label-md text-on-surface">I'm a Factory</span>
</button>
</div>
<input type="hidden" name="role" id="selectedRole" required="">
</div>
<!-- Email Input -->
<div class="space-y-xs">
<label for="email" class="font-label-sm text-label-sm text-on-surface-variant flex justify-between">
                        Email Address
                        <span id="email-error" class="text-error hidden">Invalid email format</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input type="email" id="email" name="email" placeholder="name@company.com" required="" class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md input-focus-effect outline-none transition-all">
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label for="password" class="font-label-sm text-label-sm text-on-surface-variant flex justify-between">
                        Password
                        <span class="text-on-surface-variant/60">Min. 8 characters</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input type="password" id="password" name="password" placeholder="••••••••" required="" class="w-full pl-10 pr-12 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md input-focus-effect outline-none transition-all">
<button type="button" onclick="togglePassword('password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors">
<span id="toggle-icon-password" class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-xs">
<label for="confirm-password" class="font-label-sm text-label-sm text-on-surface-variant">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock_reset</span>
<input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" class="w-full pl-10 pr-12 py-3 bg-surface border border-outline-variant rounded-lg font-body-md text-body-md input-focus-effect outline-none transition-all">
<button type="button" onclick="togglePassword('confirm-password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors">
<span id="toggle-icon-confirm-password" class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<p id="match-error" class="text-error font-label-sm text-label-sm hidden mt-xs">Passwords do not match</p>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-sm py-xs">
<div class="flex items-center h-5">
<input id="terms" type="checkbox" required="" class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary">
</div>
<label for="terms" class="font-body-md text-[12px] text-on-surface-variant leading-tight">
                        I agree to the <a href="#" class="text-primary font-bold hover:underline">Terms of Service</a> and 
                        <a href="#" class="text-primary font-bold hover:underline">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button type="submit" class="w-full bg-primary-container text-white py-4 rounded-lg font-label-md text-label-md shadow-lg shadow-primary/20 hover:bg-primary transition-all active:scale-[0.98] duration-150 flex items-center justify-center gap-base">
<span>Complete Registration</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-lg pt-lg border-t border-outline-variant flex flex-col items-center gap-md">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a href="#" onclick="window.top.postMessage({ type: 'navigate', path: '/login' }, window.location.origin); return false;" class="text-primary font-bold hover:underline ml-xs">Log In</a>
</p>
</div>
</div>
<!-- System Footer -->
<footer class="mt-xl text-center">
<p class="font-label-sm text-label-sm text-outline">© 2024 NileChain Egypt. All rights reserved.</p>
<div class="flex justify-center gap-gutter mt-sm">
<a href="#" class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary">Compliance</a>
<a href="#" class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary">Support</a>
</div>
</footer>
</main>
<!-- Success Toast (Hidden by default) -->
<div id="toast" class="fixed bottom-margin-desktop left-1/2 -translate-x-1/2 transform translate-y-20 opacity-0 transition-all duration-300 bg-secondary text-white px-lg py-md rounded-full flex items-center gap-sm shadow-xl z-50">
<span class="material-symbols-outlined" data-weight="fill">check_circle</span>
<span class="font-label-md text-label-md">Account created successfully!</span>
</div>
<script>
        function selectRole(role) {
            const farmBtn = document.getElementById('role-farm');
            const factoryBtn = document.getElementById('role-factory');
            const roleInput = document.getElementById('selectedRole');

            if (role === 'farm') {
                farmBtn.classList.add('role-card-active');
                factoryBtn.classList.remove('role-card-active');
                roleInput.value = 'farm';
            } else {
                factoryBtn.classList.add('role-card-active');
                farmBtn.classList.remove('role-card-active');
                roleInput.value = 'factory';
            }
        }

        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const icon = document.getElementById(`toggle-icon-${fieldId}`);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        const form = document.getElementById('registerForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm-password');
        const matchError = document.getElementById('match-error');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            let isValid = true;

            // Password matching validation
            if (password.value !== confirmPassword.value) {
                matchError.classList.remove('hidden');
                confirmPassword.classList.add('border-error');
                isValid = false;
            } else {
                matchError.classList.add('hidden');
                confirmPassword.classList.remove('border-error');
            }

            // Role selection validation
            if (!document.getElementById('selectedRole').value) {
                alert('Please select a business type (Farm or Factory)');
                isValid = false;
            }

            if (isValid) {
                const toast = document.getElementById('toast');
                toast.classList.remove('translate-y-20', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
                
                setTimeout(() => {
                    alert('Registration payload ready: ' + new FormData(form).get('email'));
                    // Here you would typically redirect or send data to API
                }, 1000);
            }
        });

        // Real-time matching feedback
        confirmPassword.addEventListener('input', () => {
            if (password.value && confirmPassword.value) {
                if (password.value === confirmPassword.value) {
                    matchError.classList.add('hidden');
                    confirmPassword.classList.remove('border-error');
                    confirmPassword.classList.add('border-primary');
                } else {
                    matchError.classList.remove('hidden');
                    confirmPassword.classList.add('border-error');
                }
            }
        });
    </script>
</body></html>
